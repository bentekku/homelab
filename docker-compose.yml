services:
  # ---------------------------------------------------------
  # IMMICH
  # ---------------------------------------------------------
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    restart: always
    env_file: [.env]
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 5000M # Using deploy block instead of mem_limit
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}-cuda
    restart: always
    env_file: [.env]
    volumes:
      - model-cache:/cache
    runtime: nvidia
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4096M # Using deploy block instead of mem_limit
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    deploy:
      resources:
        limits:
          memory: 512M # Using deploy block instead of mem_limit
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M # Using deploy block instead of mem_limit
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # JELLYFIN
  # ---------------------------------------------------------
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: always
    environment:
      - TZ=${TZ}
    ports:
      - "8096:8096"
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 4000M
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /mnt/homelab/server/config/jellyfin:/config
      - /mnt/homelab/server/data/media:/media

  # ---------------------------------------------------------
  # FEISHIN
  # ---------------------------------------------------------
  feishin:
    container_name: feishin
    image: ghcr.io/jeffvli/feishin:latest
    restart: unless-stopped
    environment:
      - SERVER_NAME=${FEISHIN_SERVER_NAME}
      - SERVER_TYPE=${FEISHIN_SERVER_TYPE}
      - SERVER_URL=${FEISHIN_SERVER_URL}
      - SERVER_LOCK=${FEISHIN_SERVER_LOCK}
      - ANALYTICS_DISABLED=true
    ports:
      - "9180:9180"
    deploy:
      resources:
        limits:
          memory: 512M # Using deploy block instead of mem_limit
    depends_on:
      - jellyfin

  # ---------------------------------------------------------
  # OPENCLOUD
  # ---------------------------------------------------------
  opencloud:
    container_name: opencloud
    image: opencloudeu/opencloud-rolling:latest
    restart: unless-stopped
    network_mode: host # shares host network — no ports: needed
    entrypoint:
      - /bin/sh
      - -c
      - |
        opencloud init || true
        opencloud server
    environment:
      - OC_INSECURE=false
      - OC_URL=${OC_URL}
      - OC_LOG_LEVEL=warn
      - PROXY_TLS=false
      - PROXY_HTTP_ADDR=0.0.0.0:9200
      - IDM_CREATE_DEMO_USERS=false
      - TZ=${TZ}
    # no ports: with host networking
    # no extra_hosts: not needed
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ${OC_CONFIG_DIR}:/etc/opencloud
      - ${OC_DATA_DIR}:/var/lib/opencloud

volumes:
  model-cache:
